[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Versioned via ?v= in HTML, so a short cache is safe and updates reach users quickly
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/tax-credit"
  to = "/tax-credit.html"
  status = 301

# The site root is published as-is, so hide server-side source (keys file, functions) from the public
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# No catch-all rewrite: Netlify serves /404.html with a real 404 status automatically.
