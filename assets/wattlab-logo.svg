<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Wattlab Logo</title>
<desc>Wattlab brand logo — electric bolt badge with wordmark</desc>
<defs>
  <style>
    .wl-ring { fill: none; stroke: #00E5FF; stroke-width: 6; }
    .wl-ring2 { fill: none; stroke: #00E5FF; stroke-width: 1.5; stroke-dasharray: 6 5; opacity: 0.4; }
    .wl-bg { fill: #0A0A1A; }
    .wl-bolt { fill: #00E5FF; }
    .wl-bolt-shadow { fill: #007A99; }
    .wl-word { font-family: system-ui,-apple-system,sans-serif; font-size: 68px; font-weight: 800; letter-spacing: -2px; }
    .wl-tag { font-family: system-ui,-apple-system,sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 4px; fill: #6b7280; }
  </style>
</defs>

<!-- Orbit ring -->
<circle cx="160" cy="160" r="130" class="wl-ring2"/>
<!-- Solid ring -->
<circle cx="160" cy="160" r="118" class="wl-ring"/>
<!-- Dark bg -->
<circle cx="160" cy="160" r="112" class="wl-bg"/>

<!-- Tick marks -->
<g stroke="#00E5FF" stroke-width="2" opacity="0.5">
  <line x1="160" y1="34" x2="160" y2="46"/>
  <line x1="160" y1="274" x2="160" y2="286"/>
  <line x1="34" y1="160" x2="46" y2="160"/>
  <line x1="274" y1="160" x2="286" y2="160"/>
  <line x1="68" y1="68" x2="76.5" y2="76.5"/>
  <line x1="243.5" y1="243.5" x2="252" y2="252"/>
  <line x1="252" y1="68" x2="243.5" y2="76.5"/>
  <line x1="76.5" y1="243.5" x2="68" y2="252"/>
</g>

<!-- Bolt shadow -->
<polygon points="185,78 138,158 166,158 135,242 210,148 178,148 214,78" class="wl-bolt-shadow" opacity="0.35"/>
<!-- Bolt main -->
<polygon points="182,72 132,156 162,156 130,242 208,144 174,144 212,72" class="wl-bolt"/>
<!-- Accent dot -->
<circle cx="169" cy="248" r="5" fill="#00E5FF" opacity="0.6"/>

<!-- Wordmark -->
<text x="310" y="198" class="wl-word" fill="#111827">W</text>
<text x="363" y="198" class="wl-word" fill="#00E5FF">att</text>
<text x="463" y="198" class="wl-word" fill="#111827">lab</text>

<!-- Tagline -->
<text x="312" y="228" class="wl-tag">ELECTRIC · FUTURE · NOW</text>

<!-- Underline accent -->
<rect x="312" y="238" width="260" height="2" fill="#00E5FF" rx="1" opacity="0.7"/>
</svg>
